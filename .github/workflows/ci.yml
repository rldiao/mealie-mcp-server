name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: uv sync --locked --extra dev
      - name: Audit locked dependencies
        run: |
          uv export --locked --all-extras --no-emit-project --output-file requirements-audit.txt
          uvx --from 'pip-audit==2.10.1' pip-audit --requirement requirements-audit.txt
      - run: uv run ruff check src tests
      - run: uv run pytest -q
